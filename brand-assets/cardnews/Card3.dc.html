<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .kn-root, .kn-root * { box-sizing: border-box; }
    .kn-root { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #ffd479; } a:hover { color: #ffe0a0; }
  </style>
</helmet>

<div class="kn-root" style="position: relative; width: 1200px; height: 800px; background: linear-gradient(150deg, #283593 0%, #5b21b6 48%, #9d2b6b 100%); overflow: hidden; color: #ffffff;">
  <div style="position: absolute; top: -150px; right: -140px; width: 620px; height: 620px; background: radial-gradient(circle, rgba(94,234,212,0.20) 0%, rgba(94,234,212,0) 66%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -190px; left: -150px; width: 560px; height: 560px; background: radial-gradient(circle, rgba(255,212,121,0.18) 0%, rgba(255,212,121,0) 66%); pointer-events: none;"></div>
  <svg viewBox="0 0 1200 800" width="1200" height="800" style="position: absolute; inset: 0; opacity: 0.45; pointer-events: none;" aria-hidden="true">
    <defs><pattern id="knGrid3" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern></defs>
    <rect width="1200" height="800" fill="url(#knGrid3)"/>
  </svg>

  <div style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 62px 68px 48px;">

    <div style="flex: 1 1 auto; display: flex; align-items: center; gap: 56px;">

      <!-- 좌: 핵심 문장 -->
      <div style="flex: 0 0 470px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="display: inline-block; width: 28px; height: 3px; border-radius: 2px; background: #ffd479;"></span>
          <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #ecdcff;">핵심</span>
        </div>

        <h2 style="margin: 28px 0 0; font-weight: 900; font-size: 56px; line-height: 1.3; letter-spacing: -0.02em; color: #ffffff;">
          이름을 아는 사람만<br>찾아올 수 있고,<br><span style="color: #ffd479;">모르는 사람은<br>찾지 못합니다</span>
        </h2>

        <p style="margin: 28px 0 0; font-size: 25px; font-weight: 500; line-height: 1.6; color: #e6ddf6;">
          새 환자가 들어오는 길은 아래쪽입니다.
        </p>
      </div>

      <!-- 우: 두 갈래 -->
      <div style="flex: 1 1 auto;">
        <svg viewBox="0 0 580 330" width="100%" style="display: block;" aria-label="브랜드 검색은 도달하고 증상 검색은 막혀 있는 구조">
          <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
            <text x="150" y="44" font-size="26" font-weight="700" fill="#c4f7ec" text-anchor="middle">병원 이름으로 검색</text>
            <path d="M40 92 H 250" stroke="#5eead4" stroke-width="6" stroke-linecap="round"/>
            <path d="M238 80 L 254 92 L 238 104" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="150" y="136" font-size="23" font-weight="500" fill="#e6ddf6" text-anchor="middle">도달</text>

            <text x="150" y="232" font-size="26" font-weight="700" fill="#ffc9c2" text-anchor="middle">증상·시술로 검색</text>
            <path d="M40 280 H 190" stroke="#ff9d94" stroke-width="6" stroke-linecap="round"/>
            <g stroke="#ff9d94" stroke-width="7" stroke-linecap="round">
              <path d="M218 260 L 256 298"/>
              <path d="M256 260 L 218 298"/>
            </g>
            <text x="150" y="322" font-size="23" font-weight="500" fill="#ffd8d3" text-anchor="middle">막힘</text>

            <rect x="330" y="80" width="230" height="200" rx="26" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
            <text x="445" y="165" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">우리 병원</text>
            <text x="445" y="212" font-size="25" font-weight="500" fill="#e6ddf6" text-anchor="middle">홈페이지</text>
          </g>
        </svg>
      </div>

    </div>

    <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 22px;">
      <span style="display: inline-flex; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.16); align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff;">꿈</span>
      <span style="font-size: 22px; font-weight: 700; color: #ffffff;">dream-ag.co.kr</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
