<helmet>

  <style>
    body { margin: 0; }
    .kn-root, .kn-root * { box-sizing: border-box; }

    a { color: #3a5ddb; } a:hover { color: #2944a8; }

<div class="kn-root" style="position: relative; width: 1080px; height: 1080px; background: linear-gradient(160deg, #f3f7fd 0%, #eef3fb 55%, #f7f2f0 100%); overflow: hidden; color: #16213b;">
  <div style="position: absolute; top: -170px; right: -130px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(249,115,106,0.15) 0%, rgba(249,115,106,0) 68%); pointer-events: none;"></div>

      블로그를 &lsquo;숙제&rsquo;처럼<br>쓰면, 환자는<br>오지 않습니다
    </h2>

    <p style="margin: 40px 0 0; font-size: 31px; font-weight: 500; line-height: 1.7; color: #55607a;">
      하루에 수십 개씩 찍어내는 양산 글.<br>
      도시 이름만 바꾼 복사 글.<br>
      네이버는 이런 글을 저품질로 걸러냅니다.
    </p>

    <div style="flex: 1 1 auto;"></div>

    <!-- 저품질 양산 글 시각화 -->
    <svg viewBox="0 0 928 250" width="100%" style="display: block;" aria-label="복사된 저품질 글 3개가 걸러지는 모습">
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g transform="translate(70,50)" stroke="#c2ccdd" stroke-width="5">
          <rect x="0" y="0" width="120" height="150" rx="14" fill="#ffffff"/>
          <path d="M26 40 H 94 M26 66 H 94 M26 92 H 76" stroke-width="6"/>
        </g>
        <g transform="translate(210,50)" stroke="#c2ccdd" stroke-width="5">
          <rect x="0" y="0" width="120" height="150" rx="14" fill="#ffffff"/>

        <g transform="translate(120,58)" stroke="#f9736a" stroke-width="9" opacity="0.85">

      </g>
      <g transform="translate(600,86)">
        <rect x="0" y="0" width="270" height="78" rx="39" fill="#fde8e6" stroke="#f9736a" stroke-width="2.5"/>
        <text x="135" y="52" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" font-weight="900" fill="#e0554b">저품질 필터</text>
      </g>
    </svg>

    <div style="margin-top: 38px; display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(22,33,59,0.12); padding-top: 24px;">
      <span style="display: inline-flex; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3a5ddb, #14b8a6); align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff;">꿈</span>
      <span style="font-size: 22px; font-weight: 700; color: #1c2e4a;">dream-ag.co.kr</span>
