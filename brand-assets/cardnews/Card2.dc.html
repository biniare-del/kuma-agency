<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .kn-root, .kn-root * { box-sizing: border-box; }
    .kn-root { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3a5ddb; } a:hover { color: #2944a8; }
  </style>
</helmet>

<div class="kn-root" style="position: relative; width: 1200px; height: 800px; background: linear-gradient(160deg, #f3f7fd 0%, #eef3fb 55%, #f7f2f0 100%); overflow: hidden; color: #16213b;">
  <div style="position: absolute; top: -170px; right: -130px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(249,115,106,0.15) 0%, rgba(249,115,106,0) 68%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -190px; left: -150px; width: 560px; height: 560px; background: radial-gradient(circle, rgba(58,93,219,0.12) 0%, rgba(58,93,219,0) 66%); pointer-events: none;"></div>
  <svg viewBox="0 0 1200 800" width="1200" height="800" style="position: absolute; inset: 0; opacity: 0.8; pointer-events: none;" aria-hidden="true">
    <defs><pattern id="knGrid2" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="rgba(22,33,59,0.045)" stroke-width="1"/></pattern></defs>
    <rect width="1200" height="800" fill="url(#knGrid2)"/>
  </svg>

  <div style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 62px 68px 48px;">

    <div style="flex: 1 1 auto; display: flex; align-items: center; gap: 52px;">

      <!-- 좌: 제목 -->
      <div style="flex: 0 0 440px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="display: inline-block; width: 28px; height: 3px; border-radius: 2px; background: #f9736a;"></span>
          <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #3a5ddb;">병원 이름으로 검색해 보세요</span>
        </div>

        <h2 style="margin: 28px 0 0; font-weight: 900; font-size: 56px; line-height: 1.28; letter-spacing: -0.02em; color: #14213e;">
          중개 플랫폼이<br>우리 홈페이지보다<br>위에 있습니다
        </h2>

        <p style="margin: 26px 0 0; font-size: 25px; font-weight: 500; line-height: 1.62; color: #55607a;">
          이름을 알고 찾아온 환자가,<br>우리 홈페이지에 닿기 전에<br>경쟁 병원 광고를 먼저 봅니다.
        </p>
      </div>

      <!-- 우: 검색 결과 순서 -->
      <div style="flex: 1 1 auto;">
        <svg viewBox="0 0 600 320" width="100%" style="display: block;" aria-label="검색 결과에서 중개 플랫폼이 병원 홈페이지보다 위에 노출되는 모습">
          <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
            <rect x="8" y="10" width="470" height="76" rx="16" fill="#ffffff" stroke="#e2c9c6" stroke-width="2.5"/>
            <text x="36" y="56" font-size="27" font-weight="700" fill="#8b93a5">1</text>
            <text x="70" y="56" font-size="27" font-weight="700" fill="#3c465e">중개 플랫폼</text>
            <rect x="310" y="30" width="146" height="36" rx="18" fill="#fdecea"/>
            <text x="383" y="55" font-size="20" font-weight="700" fill="#d1554b" text-anchor="middle">경쟁 병원 광고</text>

            <rect x="8" y="104" width="470" height="76" rx="16" fill="#ffffff" stroke="#e2c9c6" stroke-width="2.5"/>
            <text x="36" y="150" font-size="27" font-weight="700" fill="#8b93a5">2</text>
            <text x="70" y="150" font-size="27" font-weight="700" fill="#3c465e">중개 플랫폼</text>
            <rect x="310" y="124" width="146" height="36" rx="18" fill="#fdecea"/>
            <text x="383" y="149" font-size="20" font-weight="700" fill="#d1554b" text-anchor="middle">경쟁 병원 광고</text>

            <rect x="8" y="198" width="470" height="76" rx="16" fill="#eef2fe" stroke="#3a5ddb" stroke-width="3"/>
            <text x="36" y="244" font-size="27" font-weight="900" fill="#3a5ddb">3</text>
            <text x="70" y="244" font-size="27" font-weight="900" fill="#14213e">우리 병원 홈페이지</text>

            <path d="M520 46 L 520 216" stroke="#f9736a" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12"/>
            <path d="M510 204 L 520 220 L 530 204" fill="none" stroke="#f9736a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="520" y="300" font-size="25" font-weight="700" fill="#c9564d" text-anchor="middle">밀려남</text>
          </g>
        </svg>
      </div>

    </div>

    <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(22,33,59,0.12); padding-top: 22px;">
      <span style="display: inline-flex; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3a5ddb, #14b8a6); align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff;">꿈</span>
      <span style="font-size: 22px; font-weight: 700; color: #1c2e4a;">dream-ag.co.kr</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
