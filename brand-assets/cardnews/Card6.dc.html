<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .kn-root, .kn-root * { box-sizing: border-box; }
    .kn-root { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8aa2f5; } a:hover { color: #aebdf7; }
  </style>
</helmet>

<div class="kn-root" style="position: relative; width: 1200px; height: 800px; background: linear-gradient(155deg, #0d1024 0%, #1b1740 55%, #0f1330 100%); overflow: hidden; color: #ffffff;">
  <div style="position: absolute; top: -160px; right: -120px; width: 620px; height: 620px; background: radial-gradient(circle, rgba(124,151,242,0.30) 0%, rgba(124,151,242,0) 68%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -200px; left: -160px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(52,208,192,0.18) 0%, rgba(52,208,192,0) 66%); pointer-events: none;"></div>
  <svg viewBox="0 0 1200 800" width="1200" height="800" style="position: absolute; inset: 0; opacity: 0.5; pointer-events: none;" aria-hidden="true">
    <defs><pattern id="knGrid6" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/></pattern></defs>
    <rect width="1200" height="800" fill="url(#knGrid6)"/>
  </svg>

  <div style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 62px 68px 48px;">

    <div style="flex: 1 1 auto; display: flex; align-items: center; gap: 56px;">

      <div style="flex: 1 1 auto;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="display: inline-block; width: 30px; height: 3px; border-radius: 2px; background: #34d0c0;"></span>
          <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #a8c4ff;">무료 진단</span>
        </div>

        <h2 style="margin: 28px 0 0; font-weight: 900; font-size: 66px; line-height: 1.24; letter-spacing: -0.02em; color: #ffffff;">
          우리 병원은 지금<br>어떤 상태일까요
        </h2>

        <p style="margin: 26px 0 0; font-size: 27px; font-weight: 500; line-height: 1.6; color: #bcc3da;">
          네이버·구글·AI 검색 노출을 무료로 진단해 드립니다.<br>
          홈페이지 주소만 넣으면 1분 만에 확인됩니다.
        </p>

        <div style="margin-top: 34px; display: inline-flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #3a5ddb, #7c3aed); border-radius: 14px; padding: 20px 30px;">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><g transform="translate(16,16)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="-3" cy="-3" r="9.5"/><path d="M5 5 L 12 12"/></g></svg>
          <span style="font-size: 30px; font-weight: 900; color: #ffffff;">dream-ag.co.kr/check</span>
        </div>
      </div>

      <!-- 우: 진단 게이지 -->
      <svg viewBox="0 0 300 300" width="290" height="290" style="flex: 0 0 auto;" aria-label="검색 노출 진단 점수 게이지">
        <circle cx="150" cy="150" r="112" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="24"/>
        <circle cx="150" cy="150" r="112" fill="none" stroke="#34d0c0" stroke-width="24" stroke-linecap="round"
                stroke-dasharray="704" stroke-dashoffset="330" transform="rotate(-90 150 150)"/>
        <text x="150" y="140" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
        <text x="150" y="188" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#a8c4ff" text-anchor="middle">검색 노출 점수</text>
      </svg>

    </div>

    <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.10); padding-top: 22px;">
      <span style="display: inline-flex; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3a5ddb, #7c3aed); align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff;">꿈</span>
      <span style="font-size: 22px; font-weight: 700; color: #eef1f8;">꿈을담은에이전시</span>
      <span style="margin-left: auto; font-size: 20px; font-weight: 500; color: #8b93aa;">순위를 조작하지 않습니다</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
