# 티스토리 꿈담 블로그 최신 글 → blog.json 갱신 (하루 2회: 한국시간 09:10, 18:10)
name: blog-feed
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/blog_feed.py blog.json
      - name: commit if changed
        run: |
          if git diff --quiet -- blog.json && git ls-files --error-unmatch blog.json >/dev/null 2>&1; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.json
          git commit -m "블로그 글 목록 갱신"
          git pull --rebase origin main
          git push
